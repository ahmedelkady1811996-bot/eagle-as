<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" width="52" height="52">
  <defs>
    <linearGradient id="canMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8d939c"/>
      <stop offset="30%" stop-color="#dfe3e8"/>
      <stop offset="62%" stop-color="#aab0b8"/>
      <stop offset="100%" stop-color="#71777f"/>
    </linearGradient>
    <radialGradient id="weight" cx="42%" cy="38%" r="66%">
      <stop offset="0%" stop-color="#7b828c"/>
      <stop offset="100%" stop-color="#3f444b"/>
    </radialGradient>
  </defs>

  <!-- coin motor can -->
  <rect x="6" y="14" width="40" height="24" rx="3" fill="url(#canMetal)"/>
  <rect x="6" y="14" width="40" height="24" rx="3" fill="none" stroke="#6a7078" stroke-width=".8"/>
  <path d="M11 18v16M41 18v16" stroke="#ffffff" stroke-width="1" opacity=".35"/>

  <!-- end caps -->
  <ellipse cx="8" cy="26" rx="3" ry="12" fill="url(#weight)"/>
  <ellipse cx="44" cy="26" rx="3" ry="12" fill="url(#weight)"/>

  <!-- shaft -->
  <rect x="45" y="23" width="6" height="6" rx="2" fill="#b9bec6"/>
  <circle cx="51" cy="26" r="4.5" fill="#e0b34a" opacity=".9"/>

  <!-- leads -->
  <path d="M9 38v9h6" fill="none" stroke="#b03a2e" stroke-width="2"/>
  <path d="M43 38v9h-6" fill="none" stroke="#2f3b45" stroke-width="2"/>

  <!-- vibration marks (E38 fades these while spinning) -->
  <g class="vib-waves" fill="none" stroke="#67e8f9" stroke-width="1.8" stroke-linecap="round" opacity=".12">
    <path d="M10 8c4-3 8-3 12 0"/>
    <path d="M32 8c4-3 8-3 12 0"/>
  </g>
</svg>