<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="cone" cx="50%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#5b616c"/>
      <stop offset="55%" stop-color="#33383f"/>
      <stop offset="100%" stop-color="#1d2126"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfd4db"/>
      <stop offset="100%" stop-color="#787e88"/>
    </linearGradient>
  </defs>

  <!-- speaker cone seen from the front -->
  <circle cx="32" cy="32" r="30" fill="url(#rim)"/>
  <circle cx="32" cy="32" r="26.5" fill="#22262c"/>
  <path d="M32 32 6.5 12v40z" fill="url(#cone)"/>
  <path d="M32 32 57.5 12v40z" fill="url(#cone)"/>
  <path d="M32 32 20 8h24z" fill="#2a2f36"/>
  <path d="M32 32 20 56h24z" fill="#2a2f36"/>

  <!-- surround -->
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#8d939d" stroke-width="2"/>

  <!-- dust cap (E38 pulses this while sounding) -->
  <circle class="dust-cap" cx="32" cy="32" r="9" fill="#454b54"/>
  <circle class="dust-cap" cx="29.5" cy="29.5" r="4" fill="#5c636d" opacity=".7"/>

  <!-- sound waves (E38 fades these with the tone) -->
  <g class="sound-wave" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" opacity=".15">
    <path d="M8 24a16 16 0 0 1 0 16"/>
    <path d="M4 19a22 22 0 0 1 0 26"/>
  </g>
</svg>